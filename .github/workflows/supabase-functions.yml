name: Supabase Edge Functions — Test & Deploy

# Redeploys the edge functions when their code changes on master (v1272).
# Runs the shared AI unit tests first; nothing is deployed if they fail.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (Project Settings: Read, Edge Functions: Read & Write)
#   SUPABASE_PROJECT_REF    qltvojzcmzqiixuvauoj
#
# Function secrets (ANTHROPIC_API_KEY, AI_CRON_SECRET, …) live in the Supabase dashboard, not here.
# Only the functions listed below are deployed. To add a function, add it to the right list.

on:
  push:
    branches: [master, main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

env:
  # Signed-in user required (Supabase checks the JWT before the function runs).
  USER_FUNCTIONS: >-
    agent-run status-report-agent ai-insights meeting-ai-extract meeting-register-agent import-mapper
    ai-simulator-hint ai-simulator-debrief plan-ai-generate whisper-transcribe sim-ai-npc sim-ai-assess
  # Called by pg_cron with the AI_CRON_SECRET header instead of a user JWT.
  CRON_FUNCTIONS: ai-embed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: AI edge-function unit tests
        working-directory: supabase/functions
        run: npx vitest run

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy user functions
        run: supabase functions deploy $USER_FUNCTIONS --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Deploy cron functions
        run: supabase functions deploy $CRON_FUNCTIONS --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --use-api
