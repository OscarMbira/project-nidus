name: Platform — Build & Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/platform/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'

  pull_request:
    paths:
      - 'apps/platform/**'
      - 'packages/**'

jobs:
  build-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@nidus/platform-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.PLATFORM_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PLATFORM_SUPABASE_ANON_KEY }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-dist
          path: apps/platform/dist
      - name: Deploy to Vercel (Platform)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: pnpm dlx vercel deploy apps/platform/dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.PLATFORM_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
